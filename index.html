<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ear Training - Perception des Degrés</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #0f172a;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 20px 14px;
      box-sizing: border-box;
    }
    .container {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
      max-width: 600px;
      width: 100%;
      padding: 24px 20px;
      text-align: center;
    }
    h1 {
      font-size: 1.35rem;
      margin-top: 0;
      margin-bottom: 4px;
    }
    p.subtitle {
      color: var(--muted);
      font-size: 0.88rem;
      margin-bottom: 16px;
    }
    
    .controls-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: #f1f5f9;
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 0.82rem;
      text-align: left;
    }
    .control-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .control-item label {
      font-weight: 600;
      color: var(--muted);
    }
    .control-item select {
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--primary);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px;
      cursor: pointer;
    }
    .toggle-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      cursor: pointer;
      font-weight: 600;
      color: var(--text);
    }
    .toggle-wrapper input {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .status {
      min-height: 28px;
      font-size: 0.98rem;
      color: var(--primary);
      margin-bottom: 16px;
      font-weight: 600;
    }
    .score-badge {
      display: inline-block;
      background: #e2e8f0;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-top: 20px;
      margin-bottom: 10px;
      text-align: left;
    }

    .grid-degrees {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .btn-degree {
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 9px 4px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.15s ease;
    }
    .btn-degree strong {
      font-size: 1.05rem;
      color: var(--primary);
    }
    .btn-degree:hover { background: #e2e8f0; }
    .btn-degree:active { transform: scale(0.97); }

    .grid-quiz-answers {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .btn-quiz-choice {
      background: #fff;
      border: 2px solid var(--border);
      padding: 10px 4px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .btn-quiz-choice strong {
      font-size: 1.15rem;
      color: var(--accent);
    }
    .btn-quiz-choice span {
      font-size: 0.72rem;
      color: var(--muted);
    }
    .btn-quiz-choice:hover:not(:disabled) {
      border-color: var(--primary);
      background: #f8fafc;
    }
    .btn-quiz-choice.correct {
      background: #dcfce7 !important;
      border-color: var(--success) !important;
      color: #14532d !important;
    }
    .btn-quiz-choice.wrong {
      background: #fee2e2 !important;
      border-color: var(--danger) !important;
      color: #7f1d1d !important;
    }

    .filter-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      text-align: left;
    }
    .filter-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .btn-tag {
      background: #fff;
      border: 1px solid var(--border);
      font-size: 0.72rem;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-tag:hover { background: #e2e8f0; }
    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px 8px;
      font-size: 0.8rem;
    }
    .checkbox-grid label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .btn-main {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-main:hover { background: var(--primary-hover); }
    .btn-row {
      display: flex;
      gap: 8px;
    }
    .btn-sub {
      flex: 1;
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-sub:hover { background: #e2e8f0; }
    
    .btn-resolve {
      background: #047857;
      color: #fff;
      border: none;
      padding: 11px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      display: none;
      width: 100%;
    }
    .btn-resolve:hover { background: #065f46; }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed !important;
    }

    .answer-box {
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 14px;
      margin-top: 10px;
      display: none;
    }
    .answer-degree {
      font-size: 2.1rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 2px;
    }
    .answer-name {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .answer-detail {
      font-size: 0.82rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Ear Training Tonale</h1>
    <p class="subtitle">Méthode Bruce Arnold — Ressentir le degré</p>

    <!-- BARRE D'OPTIONS -->
    <div class="controls-bar">
      <div class="control-item">
        <label for="select-timbre">Sonorité :</label>
        <select id="select-timbre">
          <option value="rhodes">Rhodes feutré</option>
          <option value="organ">Flûte / Orgue doux</option>
          <option value="piano">Piano acoustique</option>
          <option value="marimba">Clavier percussif doux</option>
          <option value="strings">Cordes d'ensemble</option>
          <option value="choir">Chœur doux (Pad)</option>
        </select>
      </div>
      <div class="control-item">
        <label>Accords de la cadence :</label>
        <label class="toggle-wrapper">
          <input type="checkbox" id="check-inversions">
          <span>Autoriser renversements</span>
        </label>
      </div>
    </div>

    <div class="status" id="status">Prêt. Clique sur « Nouvelle écoute »</div>
    <div class="score-badge" id="score-badge">Score Quiz : 0 / 0 (0%)</div>

    <!-- SECTION 1 : ÉCOUTE CIBLÉE -->
    <div class="section-title">1. Écoute ciblée (apprivoiser la sensation)</div>
    <div class="grid-degrees" id="grid-direct"></div>

    <!-- SECTION 2 : QUIZ INTERACTIF -->
    <div class="section-title">2. Quiz à l'aveugle</div>

    <div class="filter-box">
      <div style="font-weight: 600; font-size: 0.78rem; margin-bottom: 6px;">Filtre des degrés pour le quiz :</div>
      <div class="filter-actions">
        <button class="btn-tag" id="btn-select-diatonic">Diatonique majeur (1 à 7)</button>
        <button class="btn-tag" id="btn-select-triad">Accords 1 - 3 - 5</button>
        <button class="btn-tag" id="btn-select-all">Tout cocher</button>
        <button class="btn-tag" id="btn-deselect-all">Tout décocher</button>
      </div>
      <div class="checkbox-grid" id="checkbox-grid"></div>
    </div>

    <div class="btn-group">
      <button class="btn-main" id="btn-play-quiz">▶ Nouvelle écoute (Quiz)</button>
      <div class="btn-row">
        <button class="btn-sub" id="btn-replay-all" disabled>🔁 Cadence + note</button>
        <button class="btn-sub" id="btn-replay-note" disabled>🎵 Note seule</button>
        <button class="btn-sub" id="btn-reveal" disabled>👁 Réponse</button>
      </div>
    </div>

    <div style="font-weight: 600; font-size: 0.8rem; margin-bottom: 8px; text-align: left; display: none;" id="quiz-instruction">
      Clique sur le degré entendu :
    </div>
    <div class="grid-quiz-answers" id="grid-quiz-answers"></div>

    <button class="btn-resolve" id="btn-resolve">➜ Entendre la résolution de la note</button>

    <div class="answer-box" id="answer-box">
      <div class="answer-degree" id="ans-degree">-</div>
      <div class="answer-name" id="ans-name">-</div>
      <div class="answer-detail" id="ans-detail">-</div>
    </div>
  </div>

  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    let masterGain = null;
    let delayNode = null;
    let feedbackGain = null;

    function forceMediaChannel() {
      const silentAudio = new Audio();
      silentAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
      silentAudio.play().catch(() => {});
    }

    function initAudio() {
      forceMediaChannel();
      if (!actx) {
        actx = new AudioContext();
        masterGain = actx.createGain();
        masterGain.gain.setValueAtTime(0.85, actx.currentTime);

        delayNode = actx.createDelay();
        delayNode.delayTime.setValueAtTime(0.18, actx.currentTime);

        feedbackGain = actx.createGain();
        feedbackGain.gain.setValueAtTime(0.24, actx.currentTime);

        const delayFilter = actx.createBiquadFilter();
        delayFilter.type = 'lowpass';
        delayFilter.frequency.setValueAtTime(1200, actx.currentTime);

        masterGain.connect(actx.destination);
        masterGain.connect(delayNode);
        delayNode.connect(delayFilter);
        delayFilter.connect(feedbackGain);
        feedbackGain.connect(delayNode);
        feedbackGain.connect(actx.destination);
      }
      if (actx.state === 'suspended') actx.resume();
    }

    function midiToFreq(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    const selectTimbre = document.getElementById('select-timbre');

    function playTone(midi, startTime, duration = 1.6, velocity = 0.22) {
      const timbre = selectTimbre.value;
      const freq = midiToFreq(midi);

      const osc1 = actx.createOscillator();
      const osc2 = actx.createOscillator();
      const osc3 = actx.createOscillator();
      const filter = actx.createBiquadFilter();
      const env = actx.createGain();

      const gainOsc2 = actx.createGain();
      const gainOsc3 = actx.createGain();

      let attack = 0.05;
      let release = 0.6;

      if (timbre === 'rhodes') {
        osc1.type = 'sine'; osc2.type = 'triangle'; osc3.type = 'sine';
        osc1.frequency.setValueAtTime(freq, startTime);
        osc2.frequency.setValueAtTime(freq * 2, startTime);
        osc3.frequency.setValueAtTime(freq * 3, startTime);
        gainOsc2.gain.setValueAtTime(0.26, startTime);
        gainOsc3.gain.setValueAtTime(0.08, startTime);
        attack = 0.05; release = 0.6;
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1600, startTime);
        filter.frequency.exponentialRampToValueAtTime(2600, startTime + 0.1);
        filter.frequency.exponentialRampToValueAtTime(1000, startTime + duration);

      } else if (timbre === 'organ') {
        osc1.type = 'sine'; osc2.type = 'sine'; osc3.type = 'triangle';
        osc1.frequency.setValueAtTime(freq, startTime);
        osc2.frequency.setValueAtTime(freq * 2, startTime);
        osc3.frequency.setValueAtTime(freq * 4, startTime);
        gainOsc2.gain.setValueAtTime(0.18, startTime);
        gainOsc3.gain.setValueAtTime(0.04, startTime);
        attack = 0.10; release = 0.5;
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1200, startTime);

      } else if (timbre === 'piano') {
        osc1.type = 'triangle'; osc2.type = 'sine'; osc3.type = 'sine';
        osc1.frequency.setValueAtTime(freq, startTime);
        osc2.frequency.setValueAtTime(freq * 2, startTime);
        osc3.frequency.setValueAtTime(freq * 3, startTime);
        gainOsc2.gain.setValueAtTime(0.35, startTime);
        gainOsc3.gain.setValueAtTime(0.12, startTime);
        attack = 0.015; release = 0.8;
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(3200, startTime);
        filter.frequency.exponentialRampToValueAtTime(800, startTime + duration * 0.8);

      } else if (timbre === 'marimba') {
        // Clavier percussif purifié (fondamentale pure + attaque d'octave ultra courte)
        osc1.type = 'sine'; osc2.type = 'sine'; osc3.type = 'triangle';
        osc1.frequency.setValueAtTime(freq, startTime);
        osc2.frequency.setValueAtTime(freq * 2, startTime);
        osc3.frequency.setValueAtTime(freq * 3, startTime);

        gainOsc2.gain.setValueAtTime(0.35, startTime);
        gainOsc2.gain.exponentialRampToValueAtTime(0.001, startTime + 0.08); // s'éteint en 80ms
        gainOsc3.gain.setValueAtTime(0.1, startTime);
        gainOsc3.gain.exponentialRampToValueAtTime(0.001, startTime + 0.04);

        attack = 0.008; release = 0.6;
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(2400, startTime);
        filter.frequency.exponentialRampToValueAtTime(700, startTime + 0.2);

      } else if (timbre === 'strings') {
        osc1.type = 'sawtooth'; osc2.type = 'sawtooth'; osc3.type = 'triangle';
        osc1.frequency.setValueAtTime(freq, startTime);
        osc2.frequency.setValueAtTime(freq * Math.pow(2, 4/1200), startTime);
        osc3.frequency.setValueAtTime(freq * Math.pow(2, -4/1200), startTime);
        gainOsc2.gain.setValueAtTime(0.3, startTime);
        gainOsc3.gain.setValueAtTime(0.2, startTime);
        attack = 0.22; release = 0.75;
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(950, startTime);
        filter.frequency.linearRampToValueAtTime(1400, startTime + 0.4);

      } else if (timbre === 'choir') {
        osc1.type = 'triangle'; osc2.type = 'sine'; osc3.type = 'sine';
        osc1.frequency.setValueAtTime(freq, startTime);
        osc2.frequency.setValueAtTime(freq * 2, startTime);
        osc3.frequency.setValueAtTime(freq * 3, startTime);
        gainOsc2.gain.setValueAtTime(0.25, startTime);
        gainOsc3.gain.setValueAtTime(0.08, startTime);
        attack = 0.18; release = 0.7;
        filter.type = 'bandpass';
        filter.Q.setValueAtTime(3.5, startTime);
        filter.frequency.setValueAtTime(750, startTime);
      }

      env.gain.setValueAtTime(0.0001, startTime);
      env.gain.linearRampToValueAtTime(velocity, startTime + attack);
      env.gain.exponentialRampToValueAtTime(velocity * 0.75, startTime + Math.max(attack + 0.1, duration - release));
      env.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

      osc1.connect(filter);
      osc2.connect(gainOsc2); gainOsc2.connect(filter);
      osc3.connect(gainOsc3); gainOsc3.connect(filter);
      filter.connect(env);
      env.connect(masterGain);

      const stopTime = startTime + duration + 0.1;
      osc1.start(startTime); osc2.start(startTime); osc3.start(startTime);
      osc1.stop(stopTime); osc2.stop(stopTime); osc3.stop(stopTime);
    }

    function playChord(midis, startTime, duration = 1.35) {
      midis.forEach((m, idx) => {
        const vel = idx === 0 ? 0.23 : 0.14;
        playTone(m, startTime, duration, vel);
      });
    }

    // --- LOGIQUE MUSICALE ---
    const TONICS = [
      { name: "Do", midi: 48 }, { name: "Ré♭", midi: 49 }, { name: "Ré", midi: 50 },
      { name: "Mi♭", midi: 51 }, { name: "Mi", midi: 52 }, { name: "Fa", midi: 53 },
      { name: "Fa♯", midi: 54 }, { name: "Sol", midi: 55 }, { name: "La♭", midi: 56 },
      { name: "La", midi: 57 }, { name: "Si♭", midi: 58 }, { name: "Si", midi: 59 }
    ];

    // Résolutions mélodiques calculées dans la même octave supérieure (+12)
    const DEGREES = [
      { id: "1", degree: "1", short: "Tonique", name: "Tonique", semitones: 0, diatonic: true, resolveTo: 0, isStable: true },
      { id: "b2", degree: "♭2", short: "2de min", name: "Seconde mineure", semitones: 1, diatonic: false, resolveTo: 0, isStable: false },
      { id: "2", degree: "2", short: "2de Maj", name: "Seconde majeure", semitones: 2, diatonic: true, resolveTo: 0, isStable: false },
      { id: "b3", degree: "♭3", short: "3ce min", name: "Tierce mineure", semitones: 3, diatonic: false, resolveTo: 4, isStable: false },
      { id: "3", degree: "3", short: "3ce Maj", name: "Tierce majeure", semitones: 4, diatonic: true, resolveTo: 4, isStable: true },
      { id: "4", degree: "4", short: "Quarte", name: "Quarte juste", semitones: 5, diatonic: true, resolveTo: 4, isStable: false }, // descend sur 3
      { id: "b5", degree: "♯4 / ♭5", short: "Triton", name: "Quarte augm. / Triton", semitones: 6, diatonic: false, resolveTo: 7, isStable: false }, // monte sur 5
      { id: "5", degree: "5", short: "Quinte", name: "Quinte juste", semitones: 7, diatonic: true, resolveTo: 7, isStable: true },
      { id: "b6", degree: "♭6", short: "6te min", name: "Sixte mineure", semitones: 8, diatonic: false, resolveTo: 7, isStable: false }, // descend sur 5
      { id: "6", degree: "6", short: "6te Maj", name: "Sixte majeure", semitones: 9, diatonic: true, resolveTo: 7, isStable: false }, // descend sur 5
      { id: "b7", degree: "♭7", short: "7e min", name: "Septième mineure", semitones: 10, diatonic: false, resolveTo: 9, isStable: false },
      { id: "7", degree: "7", short: "Sensible", name: "Sensible (7e majeure)", semitones: 11, diatonic: true, resolveTo: 12, isStable: false } // monte sur l'octave
    ];

    const NOTE_NAMES = ["Do", "Do♯ / Ré♭", "Ré", "Ré♯ / Mi♭", "Mi", "Fa", "Fa♯ / Sol♭", "Sol", "Sol♯ / La♭", "La", "La♯ / Si♭", "Si"];

    const VOICINGS_ROOT = [
      [[0, 7, 12, 16], [5, 9, 12, 17], [7, 7, 11, 14], [0, 7, 12, 16]],
      [[0, 4, 7, 12], [5, 5, 9, 12], [7, 2, 7, 11], [0, 4, 7, 12]],
      [[0, 12, 16, 19], [5, 12, 17, 21], [7, 11, 14, 19], [0, 12, 16, 19]],
      [[0, 7, 16, 19], [5, 9, 17, 17], [7, 11, 14, 14], [0, 7, 12, 16]]
    ];

    const VOICINGS_INVERTED = [
      [[0, 7, 12, 16], [9, 5, 12, 17], [11, 7, 14, 17], [12, 7, 12, 16]],
      [[4, 7, 12, 16], [5, 9, 12, 17], [7, 7, 11, 14], [0, 7, 12, 16]]
    ];

    function getRandomCadence(tonicMidi, allowInversions) {
      let pool = VOICINGS_ROOT;
      if (allowInversions && Math.random() > 0.45) {
        pool = VOICINGS_INVERTED;
      }
      const pattern = pool[Math.floor(Math.random() * pool.length)];
      return pattern.map(chord => chord.map(interval => tonicMidi + interval));
    }

    // --- INTERFACE ---
    const gridDirect = document.getElementById('grid-direct');
    const checkboxGrid = document.getElementById('checkbox-grid');
    const gridQuizAnswers = document.getElementById('grid-quiz-answers');
    const quizInstruction = document.getElementById('quiz-instruction');

    DEGREES.forEach(deg => {
      const btn = document.createElement('button');
      btn.className = 'btn-degree';
      btn.innerHTML = `<strong>${deg.degree}</strong><span>${deg.short}</span>`;
      btn.addEventListener('click', () => playTargetDegreeDirect(deg));
      gridDirect.appendChild(btn);
    });

    DEGREES.forEach(deg => {
      const label = document.createElement('label');
      label.innerHTML = `
        <input type="checkbox" data-id="${deg.id}" ${deg.diatonic ? 'checked' : ''}>
        <span>${deg.degree} (${deg.short})</span>
      `;
      checkboxGrid.appendChild(label);
    });

    document.getElementById('btn-select-diatonic').addEventListener('click', () => {
      DEGREES.forEach(d => document.querySelector(`input[data-id="${d.id}"]`).checked = d.diatonic);
      buildQuizButtons();
    });
    document.getElementById('btn-select-all').addEventListener('click', () => {
      DEGREES.forEach(d => document.querySelector(`input[data-id="${d.id}"]`).checked = true);
      buildQuizButtons();
    });
    document.getElementById('btn-select-triad').addEventListener('click', () => {
      DEGREES.forEach(d => document.querySelector(`input[data-id="${d.id}"]`).checked = ["1", "3", "5"].includes(d.id));
      buildQuizButtons();
    });
    document.getElementById('btn-deselect-all').addEventListener('click', () => {
      DEGREES.forEach(d => document.querySelector(`input[data-id="${d.id}"]`).checked = false);
      buildQuizButtons();
    });

    checkboxGrid.addEventListener('change', buildQuizButtons);

    function buildQuizButtons() {
      gridQuizAnswers.innerHTML = '';
      const checkedIds = Array.from(document.querySelectorAll('#checkbox-grid input:checked')).map(el => el.dataset.id);
      const activeDegrees = DEGREES.filter(d => checkedIds.includes(d.id));

      activeDegrees.forEach(deg => {
        const btn = document.createElement('button');
        btn.className = 'btn-quiz-choice';
        btn.dataset.id = deg.id;
        btn.innerHTML = `<strong>${deg.degree}</strong><span>${deg.short}</span>`;
        btn.addEventListener('click', () => checkAnswer(deg, btn));
        gridQuizAnswers.appendChild(btn);
      });
    }
    buildQuizButtons();

    let currentTonic = null;
    let currentDegree = null;
    let currentTargetMidi = null;
    let quizAnswered = false;
    let scoreTotal = 0;
    let scoreCorrect = 0;

    const statusEl = document.getElementById('status');
    const scoreBadge = document.getElementById('score-badge');
    const checkInversions = document.getElementById('check-inversions');
    const btnPlayQuiz = document.getElementById('btn-play-quiz');
    const btnReplayAll = document.getElementById('btn-replay-all');
    const btnReplayNote = document.getElementById('btn-replay-note');
    const btnReveal = document.getElementById('btn-reveal');
    const btnResolve = document.getElementById('btn-resolve');
    const answerBox = document.getElementById('answer-box');
    const ansDegree = document.getElementById('ans-degree');
    const ansName = document.getElementById('ans-name');
    const ansDetail = document.getElementById('ans-detail');

    function updateScoreDisplay() {
      const pct = scoreTotal === 0 ? 0 : Math.round((scoreCorrect / scoreTotal) * 100);
      scoreBadge.textContent = `Score Quiz : ${scoreCorrect} / ${scoreTotal} (${pct}%)`;
    }

    function setInteractiveDisabled(state) {
      btnPlayQuiz.disabled = state;
      btnReplayAll.disabled = state;
      btnReplayNote.disabled = state;
      btnReveal.disabled = state;
      document.querySelectorAll('.btn-degree').forEach(b => b.disabled = state);
      document.querySelectorAll('.btn-quiz-choice').forEach(b => b.disabled = state || quizAnswered);
    }

    function sequenceAudio(mode = 'quiz') {
      initAudio();
      setInteractiveDisabled(true);
      btnResolve.style.display = 'none';

      if (mode === 'quiz') {
        quizAnswered = false;
        answerBox.style.display = 'none';
        quizInstruction.style.display = 'block';
        document.querySelectorAll('.btn-quiz-choice').forEach(b => {
          b.className = 'btn-quiz-choice';
          b.disabled = true;
        });
      }

      const now = actx.currentTime + 0.05;
      statusEl.textContent = "Écoute de la cadence...";

      const chords = getRandomCadence(currentTonic.midi, checkInversions.checked);
      const chordStep = 0.95;
      const chordDuration = 1.35;

      chords.forEach((chord, idx) => {
        const dur = (idx === 3) ? 1.8 : chordDuration;
        playChord(chord, now + (idx * chordStep), dur);
      });

      // Pause respiratoire d'environ 1.8s après la fin du dernier accord
      const targetTime = now + (3 * chordStep) + 2.0;

      setTimeout(() => {
        if (mode === 'quiz') {
          statusEl.textContent = "Quelle est cette note ?";
        } else {
          statusEl.textContent = `Écoute du degré : ${currentDegree.degree} (${currentDegree.name})`;
        }
      }, Math.max(0, (targetTime - now - 0.2) * 1000));

      playTone(currentTargetMidi, targetTime, 2.5, 0.26);

      setTimeout(() => {
        setInteractiveDisabled(false);
        if (mode === 'quiz') {
          document.querySelectorAll('.btn-quiz-choice').forEach(b => b.disabled = false);
        } else {
          btnResolve.style.display = 'inline-block';
        }
      }, (targetTime - now + 2.5) * 1000);
    }

    function checkAnswer(chosenDegree, buttonEl) {
      if (quizAnswered) return;
      quizAnswered = true;
      scoreTotal++;

      const isCorrect = (chosenDegree.id === currentDegree.id);
      if (isCorrect) {
        scoreCorrect++;
        buttonEl.classList.add('correct');
        statusEl.textContent = "Bravo, c'est exact !";
      } else {
        buttonEl.classList.add('wrong');
        const correctBtn = document.querySelector(`.btn-quiz-choice[data-id="${currentDegree.id}"]`);
        if (correctBtn) correctBtn.classList.add('correct');
        statusEl.textContent = `Erreur : c'était le degré ${currentDegree.degree} (${currentDegree.short})`;
      }

      updateScoreDisplay();
      revealAnswer(false);
      btnResolve.style.display = 'inline-block';
      document.querySelectorAll('.btn-quiz-choice').forEach(b => b.disabled = true);
    }

    function revealAnswer(updateStatusText = true) {
      ansDegree.textContent = currentDegree.degree;
      ansName.textContent = currentDegree.name;
      const noteName = NOTE_NAMES[currentTargetMidi % 12];
      ansDetail.textContent = `Tonalité : ${currentTonic.name} majeur | Note jouée : ${noteName}`;
      answerBox.style.display = 'block';
      btnResolve.style.display = 'inline-block';
      if (updateStatusText) statusEl.textContent = "Résultat affiché";
    }

    // RÉSOLUTION MÉLODIQUE CORRIGÉE : Mouvement conjoint mélodique net et legato
    btnResolve.addEventListener('click', () => {
      if (!currentTargetMidi || !currentDegree) return;
      initAudio();
      const now = actx.currentTime + 0.05;

      if (currentDegree.isStable) {
        // C'est déjà une note stable (1, 3 ou 5) : on joue l'accord de tonique pour faire entendre la stabilité
        statusEl.textContent = `Note stable (${currentDegree.degree}) dans l'accord parfait`;
        playTone(currentTargetMidi, now, 1.2, 0.25);
        playChord([currentTonic.midi, currentTonic.midi + 7, currentTonic.midi + 12, currentTonic.midi + 16], now + 0.6, 2.0);
      } else {
        // Note de tension : on joue la note cible (1.1s) puis son glissement naturel vers la note de repos (2.0s)
        const resolveMidi = currentTonic.midi + 12 + currentDegree.resolveTo;
        statusEl.textContent = `Résolution : ${currentDegree.degree} ➜ note de repos`;
        playTone(currentTargetMidi, now, 1.1, 0.25);
        playTone(resolveMidi, now + 0.95, 2.0, 0.27);
      }
    });

    function playTargetDegreeDirect(deg) {
      currentTonic = TONICS[Math.floor(Math.random() * TONICS.length)];
      currentDegree = deg;
      currentTargetMidi = currentTonic.midi + 12 + currentDegree.semitones;

      revealAnswer(false);
      quizInstruction.style.display = 'none';
      gridQuizAnswers.innerHTML = '';
      buildQuizButtons();

      sequenceAudio('direct');
    }

    btnPlayQuiz.addEventListener('click', () => {
      const checkedIds = Array.from(document.querySelectorAll('#checkbox-grid input:checked')).map(el => el.dataset.id);
      if (checkedIds.length === 0) {

        return;
      }
      buildQuizButtons();

      const pool = DEGREES.filter(d => checkedIds.includes(d.id));
      currentTonic = TONICS[Math.floor(Math.random() * TONICS.length)];
      currentDegree = pool[Math.floor(Math.random() * pool.length)];
      currentTargetMidi = currentTonic.midi + 12 + currentDegree.semitones;

      sequenceAudio('quiz');
    });

    btnReplayAll.addEventListener('click', () => {
      if (!currentTonic) return;
      sequenceAudio('replay');
    });

    btnReplayNote.addEventListener('click', () => {
      if (!currentTargetMidi) return;
      initAudio();
      statusEl.textContent = "Note seule...";
      playTone(currentTargetMidi, actx.currentTime + 0.05, 2.5, 0.26);
    });
