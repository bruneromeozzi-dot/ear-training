<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ear Training - Perception des Degrés</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #0f172a;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
      box-sizing: border-box;
    }
    .container {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
      max-width: 580px;
      width: 100%;
      padding: 28px 24px;
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      margin-top: 0;
      margin-bottom: 4px;
    }
    p.subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 16px;
    }
    .timbre-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #f1f5f9;
      padding: 6px 12px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 0.85rem;
      color: var(--text);
    }
    .timbre-bar select {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
    }
    .status {
      min-height: 26px;
      font-size: 1rem;
      color: var(--primary);
      margin-bottom: 18px;
      font-weight: 600;
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-top: 22px;
      margin-bottom: 10px;
      text-align: left;
    }
    .grid-degrees {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .btn-degree-direct {
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 9px 4px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.15s ease;
    }
    .btn-degree-direct strong {
      font-size: 1.05rem;
      color: var(--primary);
    }
    .btn-degree-direct:hover {
      background: #e2e8f0;
      border-color: #cbd5e1;
    }
    .btn-degree-direct:active {
      transform: scale(0.97);
    }
    .filter-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      text-align: left;
    }
    .filter-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .btn-tag {
      background: #fff;
      border: 1px solid var(--border);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-tag:hover { background: #e2e8f0; }
    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px 12px;
      font-size: 0.82rem;
    }
    .checkbox-grid label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    button {
      font-family: inherit;
    }
    .btn-main {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-main:hover { background: var(--primary-hover); }
    .btn-row {
      display: flex;
      gap: 10px;
    }
    .btn-sub {
      flex: 1;
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 11px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-sub:hover { background: #e2e8f0; }
    .btn-reveal {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-reveal:hover { background: #1e293b; }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed !important;
    }
    .answer-box {
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;
      display: none;
    }
    .answer-degree {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 4px;
    }
    .answer-name {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .answer-detail {
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Ear Training Tonale</h1>
    <p class="subtitle">Méthode Bruce Arnold — Ressentir le degré</p>

    <div class="timbre-bar">
      <span>Sonorité de l'instrument :</span>
      <select id="select-timbre">
        <option value="rhodes">Rhodes feutré (rond et spatial)</option>
        <option value="organ">Flûte / Orgue doux (méditatif)</option>
        <option value="piano">Piano acoustique doux</option>
      </select>
    </div>

    <div class="status" id="status">Prêt. Choisis une action ci-dessous.</div>

    <div class="section-title">1. Écoute ciblée (apprivoiser la sensation)</div>
    <div class="grid-degrees" id="grid-direct"></div>

    <div class="section-title">2. Quiz à l'aveugle</div>

    <div class="filter-box">
      <div style="font-weight: 600; font-size: 0.8rem; margin-bottom: 6px;">Degrés autorisés dans le quiz :</div>
      <div class="filter-actions">
        <button class="btn-tag" id="btn-select-diatonic">Diatonique majeur (1 à 7)</button>
        <button class="btn-tag" id="btn-select-triad">Accords 1 - 3 - 5</button>
        <button class="btn-tag" id="btn-select-all">Tout cocher</button>
      </div>
      <div class="checkbox-grid" id="checkbox-grid"></div>
    </div>

    <div class="btn-group">
      <button class="btn-main" id="btn-play-quiz">▶ Nouvelle écoute (Quiz au hasard)</button>
      <div class="btn-row">
        <button class="btn-sub" id="btn-replay-all" disabled>🔁 Cadence + note</button>
        <button class="btn-sub" id="btn-replay-note" disabled>🎵 Note seule</button>
      </div>
      <button class="btn-reveal" id="btn-reveal" disabled>👁 Voir la réponse</button>
    </div>

    <div class="answer-box" id="answer-box">
      <div class="answer-degree" id="ans-degree">-</div>
      <div class="answer-name" id="ans-name">-</div>
      <div class="answer-detail" id="ans-detail">-</div>
    </div>
  </div>

  <script>
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    let masterGain = null;
    let delayNode = null;
    let feedbackGain = null;

    // Force Android et iOS à router le son dans le canal "Média"
    function forceMediaChannel() {
      const silentAudio = new Audio();
      silentAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
      silentAudio.play().catch(() => {});
    }

    function initAudio() {
      forceMediaChannel();

      if (!actx) {
        actx = new AudioContext();
        masterGain = actx.createGain();
        masterGain.gain.setValueAtTime(0.85, actx.currentTime);

        delayNode = actx.createDelay();
        delayNode.delayTime.setValueAtTime(0.18, actx.currentTime);

        feedbackGain = actx.createGain();
        feedbackGain.gain.setValueAtTime(0.24, actx.currentTime);

        const delayFilter = actx.createBiquadFilter();
        delayFilter.type = 'lowpass';
        delayFilter.frequency.setValueAtTime(1200, actx.currentTime);

        masterGain.connect(actx.destination);
        masterGain.connect(delayNode);
        delayNode.connect(delayFilter);
        delayFilter.connect(feedbackGain);
        feedbackGain.connect(delayNode);
        feedbackGain.connect(actx.destination);
      }
      if (actx.state === 'suspended') actx.resume();
    }

    function midiToFreq(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    const selectTimbre = document.getElementById('select-timbre');

    function playTone(midi, startTime, duration = 1.6, velocity = 0.22) {
      const timbre = selectTimbre.value;
      const freq = midiToFreq(midi);

      const osc1 = actx.createOscillator();
      const osc2 = actx.createOscillator();
      const osc3 = actx.createOscillator();
      const filter = actx.createBiquadFilter();
      const env = actx.createGain();

      const gainOsc2 = actx.createGain();
      const gainOsc3 = actx.createGain();

      let attack = 0.05;
      let release = 0.6;
      let filterCutoff = 1500;

      if (timbre === 'rhodes') {
        osc1.type = 'sine';
        osc2.type = 'triangle';
        osc3.type = 'sine';

        osc1.frequency.setValueAtTime(freq, startTime);
        osc2.frequency.setValueAtTime(freq * 2, startTime);
        osc3.frequency.setValueAtTime(freq * 3, startTime);

        gainOsc2.gain.setValueAtTime(0.26, startTime);
        gainOsc3.gain.setValueAtTime(0.08, startTime);

        attack = 0.05;
        release = 0.6;
        filterCutoff = 1600;

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(filterCutoff, startTime);
        filter.frequency.exponentialRampToValueAtTime(2600, startTime + 0.1);
        filter.frequency.exponentialRampToValueAtTime(1000, startTime + duration);

      } else if (timbre === 'organ') {
        osc1.type = 'sine';
        osc2.type = 'sine';
        osc3.type = 'triangle';

        osc1.frequency.setValueAtTime(freq, startTime);
        osc2.frequency.setValueAtTime(freq * 2, startTime);
        osc3.frequency.setValueAtTime(freq * 4, startTime);

        gainOsc2.gain.setValueAtTime(0.18, startTime);
        gainOsc3.gain.setValueAtTime(0.04, startTime);

        attack = 0.10;
        release = 0.5;
        filterCutoff = 1200;

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(filterCutoff, startTime);

      } else if (timbre === 'piano') {
        osc1.type = 'triangle';
        osc2.type = 'sine';
        osc3.type = 'sine';

        osc1.frequency.setValueAtTime(freq, startTime);
        osc2.frequency.setValueAtTime(freq * 2, startTime);
        osc3.frequency.setValueAtTime(freq * 3, startTime);

        gainOsc2.gain.setValueAtTime(0.35, startTime);
        gainOsc3.gain.setValueAtTime(0.12, startTime);

        attack = 0.015;
        release = 0.8;

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(3200, startTime);
        filter.frequency.exponentialRampToValueAtTime(800, startTime + duration * 0.8);
      }

      env.gain.setValueAtTime(0.0001, startTime);
      env.gain.linearRampToValueAtTime(velocity, startTime + attack);
      env.gain.exponentialRampToValueAtTime(velocity * 0.75, startTime + Math.max(attack + 0.1, duration - release));
      env.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

      osc1.connect(filter);
      osc2.connect(gainOsc2);
      gainOsc2.connect(filter);
      osc3.connect(gainOsc3);
      gainOsc3.connect(filter);

      filter.connect(env);
      env.connect(masterGain);

      const stopTime = startTime + duration + 0.1;
      osc1.start(startTime);
      osc2.start(startTime);
      osc3.start(startTime);

      osc1.stop(stopTime);
      osc2.stop(stopTime);
      osc3.stop(stopTime);
    }

    function playChord(midis, startTime, duration = 1.35) {
      midis.forEach((m, idx) => {
        const vel = idx === 0 ? 0.22 : 0.14;
        playTone(m, startTime, duration, vel);
      });
    }

    const TONICS = [
      { name: "Do", midi: 48 },
      { name: "Ré♭", midi: 49 },
      { name: "Ré", midi: 50 },
      { name: "Mi♭", midi: 51 },
      { name: "Mi", midi: 52 },
      { name: "Fa", midi: 53 },
      { name: "Fa♯", midi: 54 },
      { name: "Sol", midi: 55 },
      { name: "La♭", midi: 56 },
      { name: "La", midi: 57 },
      { name: "Si♭", midi: 58 },
      { name: "Si", midi: 59 }
    ];

    const DEGREES = [
      { id: "1", degree: "1", short: "Tonique", name: "Tonique", semitones: 0, diatonic: true },
      { id: "b2", degree: "♭2", short: "2de min", name: "Seconde mineure", semitones: 1, diatonic: false },
      { id: "2", degree: "2", short: "2de Maj", name: "Seconde majeure", semitones: 2, diatonic: true },
      { id: "b3", degree: "♭3", short: "3ce min", name: "Tierce mineure", semitones: 3, diatonic: false },
      { id: "3", degree: "3", short: "3ce Maj", name: "Tierce majeure", semitones: 4, diatonic: true },
      { id: "4", degree: "4", short: "Quarte", name: "Quarte juste", semitones: 5, diatonic: true },
      { id: "b5", degree: "♯4 / ♭5", short: "Triton", name: "Quarte augm. / Triton", semitones: 6, diatonic: false },
      { id: "5", degree: "5", short: "Quinte", name: "Quinte juste", semitones: 7, diatonic: true },
      { id: "b6", degree: "♭6", short: "6te min", name: "Sixte mineure", semitones: 8, diatonic: false },
      { id: "6", degree: "6", short: "6te Maj", name: "Sixte majeure", semitones: 9, diatonic: true },
      { id: "b7", degree: "♭7", short: "7e min", name: "Septième mineure", semitones: 10, diatonic: false },
      { id: "7", degree: "7", short: "Sensible", name: "Sensible (7e majeure)", semitones: 11, diatonic: true }
    ];

    const NOTE_NAMES = ["Do", "Do♯ / Ré♭", "Ré", "Ré♯ / Mi♭", "Mi", "Fa", "Fa♯ / Sol♭", "Sol", "Sol♯ / La♭", "La", "La♯ / Si♭", "Si"];

    function getCadenceMidis(tonicMidi) {
      return [
        [tonicMidi, tonicMidi + 7, tonicMidi + 12, tonicMidi + 16],
        [tonicMidi + 5, tonicMidi + 9, tonicMidi + 12, tonicMidi + 17],
        [tonicMidi + 7, tonicMidi + 7, tonicMidi + 11, tonicMidi + 14],
        [tonicMidi, tonicMidi + 7, tonicMidi + 12, tonicMidi + 16]
      ];
    }

    const gridDirect = document.getElementById('grid-direct');
    const checkboxGrid = document.getElementById('checkbox-grid');

    DEGREES.forEach(deg => {
      const btn = document.createElement('button');
      btn.className = 'btn-degree-direct';
      btn.innerHTML = `<strong>${deg.degree}</strong><span>${deg.short}</span>`;
      btn.addEventListener('click', () => playTargetDegreeDirect(deg));
      gridDirect.appendChild(btn);
    });

    DEGREES.forEach(deg => {
      const label = document.createElement('label');
      label.innerHTML = `
        <input type="checkbox" data-id="${deg.id}" ${deg.diatonic ? 'checked' : ''}>
        <span>${deg.degree} (${deg.short})</span>
      `;
      checkboxGrid.appendChild(label);
    });

    document.getElementById('btn-select-diatonic').addEventListener('click', () => {
      DEGREES.forEach(d => {
        document.querySelector(`input[data-id="${d.id}"]`).checked = d.diatonic;
      });
    });
    document.getElementById('btn-select-all').addEventListener('click', () => {
      DEGREES.forEach(d => {
        document.querySelector(`input[data-id="${d.id}"]`).checked = true;
      });
    });
    document.getElementById('btn-select-triad').addEventListener('click', () => {
      DEGREES.forEach(d => {
        document.querySelector(`input[data-id="${d.id}"]`).checked = ["1", "3", "5"].includes(d.id);
      });
    });

    let currentTonic = null;
    let currentDegree = null;
    let currentTargetMidi = null;

    const statusEl = document.getElementById('status');
    const btnPlayQuiz = document.getElementById('btn-play-quiz');
    const btnReplayAll = document.getElementById('btn-replay-all');
    const btnReplayNote = document.getElementById('btn-replay-note');
    const btnReveal = document.getElementById('btn-reveal');
    const answerBox = document.getElementById('answer-box');
    const ansDegree = document.getElementById('ans-degree');
    const ansName = document.getElementById('ans-name');
    const ansDetail = document.getElementById('ans-detail');

    function setAllInteractiveDisabled(state) {
      btnPlayQuiz.disabled = state;
      btnReplayAll.disabled = state;
      btnReplayNote.disabled = state;
      btnReveal.disabled = state;
      document.querySelectorAll('.btn-degree-direct').forEach(b => b.disabled = state);
    }

    function sequenceAudio(mode = 'quiz') {
      initAudio();
      setAllInteractiveDisabled(true);
      if (mode === 'quiz') {
        answerBox.style.display = 'none';
      }

      const now = actx.currentTime + 0.05;
      statusEl.textContent = "Écoute de la cadence...";

      const chords = getCadenceMidis(currentTonic.midi);
      const chordStep = 1.0;
      const chordDuration = 1.35;

      chords.forEach((chord, idx) => {
        const dur = (idx === 3) ? 1.8 : chordDuration;
        playChord(chord, now + (idx * chordStep), dur);
      });

      const targetTime = now + (3 * chordStep) + 1.85;

      setTimeout(() => {
        if (mode === 'quiz') {
          statusEl.textContent = "Quelle est cette note ?";
        } else {
          statusEl.textContent = `Écoute du degré : ${currentDegree.degree} (${currentDegree.name})`;
        }
      }, Math.max(0, (targetTime - now - 0.1) * 1000));

      playTone(currentTargetMidi, targetTime, 2.5, 0.26);

      setTimeout(() => {
        setAllInteractiveDisabled(false);
      }, (targetTime - now + 2.6) * 1000);
    }

    function playTargetDegreeDirect(deg) {
      currentTonic = TONICS[Math.floor(Math.random() * TONICS.length)];
      currentDegree = deg;
      currentTargetMidi = currentTonic.midi + 12 + currentDegree.semitones;

      ansDegree.textContent = currentDegree.degree;
      ansName.textContent = currentDegree.name;
      const noteName = NOTE_NAMES[currentTargetMidi % 12];
      ansDetail.textContent = `Tonalité : ${currentTonic.name} majeur | Note : ${noteName}`;
      answerBox.style.display = 'block';

      sequenceAudio('direct');
    }

    btnPlayQuiz.addEventListener('click', () => {
      const checkedIds = Array.from(document.querySelectorAll('#checkbox-grid input:checked')).map(el => el.dataset.id);

      if (checkedIds.length === 0) {
        alert("Coche au moins un degré dans les filtres ci-dessus !");
        return;
      }

      const pool = DEGREES.filter(d => checkedIds.includes(d.id));
      currentTonic = TONICS[Math.floor(Math.random() * TONICS.length)];
      currentDegree = pool[Math.floor(Math.random() * pool.length)];
      currentTargetMidi = currentTonic.midi + 12 + currentDegree.semitones;

      sequenceAudio('quiz');
    });

    btnReplayAll.addEventListener('click', () => {
      if (!currentTonic) return;
      sequenceAudio('replay');
    });

    btnReplayNote.addEventListener('click', () => {
      if (!currentTargetMidi) return;
      initAudio();
      statusEl.textContent = "Note seule...";
      playTone(currentTargetMidi, actx.currentTime + 0.05, 2.5, 0.26);
    });

    btnReveal.addEventListener('click', () => {
      if (!currentDegree) return;
      ansDegree.textContent = currentDegree.degree;
      ansName.textContent = currentDegree.name;
      const noteName = NOTE_NAMES[currentTargetMidi % 12];
      ansDetail.textContent = `Tonalité : ${currentTonic.name} majeur | Note jouée : ${noteName}`;
      answerBox.style.display = 'block';
      statusEl.textContent = "Résultat affiché";
    });
  </script>
</body>
</html>
